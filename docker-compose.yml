services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openfoodledger
      POSTGRES_PASSWORD: openfoodledger
      POSTGRES_DB: openfoodledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfoodledger"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://openfoodledger:openfoodledger@db:5432/openfoodledger
      ALLOWED_ORIGINS: "*"
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload Python changes from host
      - ./app:/app/app
      # Make new migrations visible without an image rebuild
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    # Run pending migrations before starting the app. Schema lifecycle is
    # managed entirely by Alembic — the application code does no create_all.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    environment:
      # Inside compose, /api requests must reach the api container, not localhost.
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      # Bind-mount source for HMR; anonymous volume preserves the image's
      # node_modules (otherwise the bind would shadow it with host's empty dir
      # if the host hasn't run `npm install`).
      - ./frontend:/app
      - /app/node_modules

  mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    depends_on:
      - api
    environment:
      # Inside compose, MCP talks to the API via the service hostname.
      FOOD_API_URL: http://api:8000
      # Browser-facing URL for OAuth metadata (Claude.ai/ChatGPT discover this).
      # For public access put your ngrok/Cloudflare/CDN URL here.
      MCP_PUBLIC_URL: http://localhost:8001
      # MCP_TRANSPORT defaults to "http" in the image; OAuth auto-enabled.
    ports:
      - "8001:8001"
    # Compose-level hardening (Dockerfile already runs as non-root uid 1000)
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8001/.well-known/oauth-authorization-server', timeout=3).status == 200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pgdata:
