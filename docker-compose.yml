services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foodtracker
      POSTGRES_PASSWORD: foodtracker
      POSTGRES_DB: foodtracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodtracker"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://foodtracker:foodtracker@db:5432/foodtracker
      ALLOWED_ORIGINS: "*"
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload Python changes from host
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    environment:
      # Inside compose, /api requests must reach the api container, not localhost.
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      # Bind-mount source for HMR; anonymous volume preserves the image's
      # node_modules (otherwise the bind would shadow it with host's empty dir
      # if the host hasn't run `npm install`).
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
